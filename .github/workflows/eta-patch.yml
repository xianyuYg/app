name: eta patch discovery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply discovery patch
        run: |
          curl -fsSL -o src-tauri/src/discovery/mod.rs "https://paste.rs/2cEei"
          test "$(sha256sum src-tauri/src/discovery/mod.rs | cut -d' ' -f1)" = "d66b4777447e0eb3b3c60fdb8d93c0fb449880d7971956eab7b0abf7d69a0f66"
      - name: Commit and push
        run: |
          git config user.name "eta-agent"
          git config user.email "eta@users.noreply.github.com"
          git add src-tauri/src/discovery/mod.rs
          git commit -m "fix(discovery): load cards from Character Tavern web data endpoints"
          git push
